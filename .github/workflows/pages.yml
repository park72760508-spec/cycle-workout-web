# GitHub Pages 배포 (2026-11-07) — 저장소 설정 Pages > Source 를 "GitHub Actions" 로 두고 이 워크플로가 직접 배포한다.
# 기존 "branch(main) 자동 빌드" 방식은 파일 동기화(syncing_files)에서 시간 초과로 자주 실패했다.
# 서버 전용 폴더(functions·supabase·scripts)는 사이트에 올리지 않아 배포 크기를 줄인다. 사이트가 참조하지 않는 폴더만 제외.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 2026-11-10 배포 실패 원인 분석 반영(실패 8건 중 사이트 크기가 원인인 것은 없었음 — 업로드 5~9초, 크기 188MB 로 성공·실패 동일):
#  ① 동기화(syncing_files) 중인 배포를 새 푸시가 취소(cancel-in-progress: true) → 같은 배포가 여러 번 취소돼 끝내 못 올라감
#     → false: 진행 중인 배포는 끝까지 두고, 대기 중인 것은 가장 최신 커밋 하나만 남김(GitHub 기본 동작)
#  ② gh run rerun 으로 재시도하면 같은 이름(github-pages) 업로드 파일이 시도마다 쌓여 'Multiple artifacts' 로 배포 거부
#     → 업로드 파일 이름에 시도 번호를 붙여 재시도해도 충돌하지 않게 함
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 파일만 모으기
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' --exclude='.cache' --exclude='.claude' --exclude='.playwright-mcp' \
            --exclude='node_modules' --exclude='/functions' --exclude='/supabase' --exclude='/scripts' \
            ./ _site/
          touch _site/.nojekyll
          echo "files: $(find _site -type f | wc -l), size: $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # 파일 동기화(syncing_files)가 느린 날이 있어 기본 10분 → 30분까지 기다림(액션이 허용하는 최대는 10분)
          timeout: 1800000
