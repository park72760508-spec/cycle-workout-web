# 루트맵 지하철역·버스 정류장 데이터 자동 갱신 (2026-11-02)
# 매주 월요일 03:00 KST(일 18:00 UTC): OpenStreetMap + 공식 버스 데이터(서울 열린데이터광장·국토교통부 TAGO)를 다시 받아
# 바뀐 경우에만 캐시 버전을 올리고 main 에 커밋·푸시(→ GitHub Pages 반영).
# TAGO 는 하루 호출 한도 때문에 실행마다 최대 9000개 노선씩(없는 것·30일 지난 것부터) — 수집 결과는 Actions 캐시로 다음 실행에 이어 씀.
# 필요한 저장소 비밀값: DATA_GO_KR_KEY(공공데이터포털 인증키, 없으면 공식 데이터 수집은 건너뜀)
# Actions 탭에서 "Run workflow" 로 수동 실행도 가능
name: Transit data refresh

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transit-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: osmium 설치·국내 OSM 추출본 내려받기
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/kr.osm.pbf" https://download.geofabrik.de/asia/south-korea-latest.osm.pbf

      - name: 지하철 데이터(역·호선 + 노선도)
        id: subway
        continue-on-error: true
        run: |
          node scripts/build-kr-subway.mjs
          node scripts/build-kr-subway-lines.mjs --pbf "$RUNNER_TEMP/kr.osm.pbf"
          if [ -n "$(git status --porcelain assets/data/kr-subway.json assets/data/kr-subway-lines.json)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi

      - name: 공식 버스 데이터 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/kr-bus-official
          key: kr-bus-official-${{ github.run_id }}
          restore-keys: kr-bus-official-

      - name: 공식 버스 데이터 수집(서울·TAGO)
        if: env.DATA_GO_KR_KEY != ''
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-kr-bus-official.mjs

      - name: 공식 버스 데이터 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/kr-bus-official
          key: kr-bus-official-${{ github.run_id }}

      - name: 버스 데이터
        id: bus
        continue-on-error: true
        run: |
          node scripts/build-kr-bus.mjs --pbf "$RUNNER_TEMP/kr.osm.pbf"
          node scripts/build-kr-bus-search.mjs
          node scripts/pack-kr-bus-routes.mjs
          if [ -n "$(git status --porcelain assets/data/kr-bus)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi

      - name: 캐시 버전 올리고 커밋·푸시
        if: steps.subway.outputs.changed == '1' || steps.bus.outputs.changed == '1'
        run: |
          FLAGS=""
          [ "${{ steps.subway.outputs.changed }}" = "1" ] && FLAGS="$FLAGS --subway"
          [ "${{ steps.bus.outputs.changed }}" = "1" ] && FLAGS="$FLAGS --bus"
          node scripts/bump-transit-data-version.mjs $FLAGS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/kr-subway.json assets/data/kr-subway-lines.json assets/data/kr-bus assets/js/outdoorRide.js index.html
          git commit -m "루트맵 지하철·버스 데이터 자동 갱신 ($(date -u +%Y-%m-%d))$FLAGS"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 실패 표시
        if: steps.subway.outcome == 'failure' || steps.bus.outcome == 'failure'
        run: |
          echo "지하철: ${{ steps.subway.outcome }} / 버스: ${{ steps.bus.outcome }}"
          exit 1
